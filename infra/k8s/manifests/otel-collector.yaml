apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: "airflow"
              scrape_interval: 10s
              static_configs:
                - targets: ["statsd-exporter:9102"]
            - job_name: "pyspark"
              scrape_interval: 10s
              static_configs:
                - targets: ["pushgateway:9091"]
            - job_name: "orders-service"
              scrape_interval: 10s
              static_configs:
                - targets: ["orders-service:8000"]
            - job_name: "inventory-service"
              scrape_interval: 10s
              static_configs:
                - targets: ["inventory-service:8001"]
            - job_name: "kafka-producer"
              scrape_interval: 10s
              static_configs:
                - targets: ["kafka-producer:8002"]
            - job_name: "kafka-consumer"
              scrape_interval: 10s
              static_configs:
                - targets: ["kafka-consumer:8003"]

      filelog:
        include:
          - /var/log/pods/*/*/*.log
        start_at: beginning
        operators:
          - type: json_parser
            timestamp:
              parse_from: attributes.timestamp
              layout_type: gotime
              layout: "2006-01-02T15:04:05.999999999Z07:00"
            severity:
              parse_from: attributes.level

    processors:
      batch:
        send_batch_size: 8192
        timeout: 1s

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "otel"

      otlphttp:
        # Refers to the Helm-installed Logstash service
        endpoint: "http://logstash-logstash:5000"
        encoding: json

    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [batch]
          exporters: [prometheus]
        logs:
          receivers: [filelog]
          processors: [batch]
          exporters: [otlphttp]
      telemetry:
        logs:
          level: "info"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          command: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - containerPort: 8888
            - containerPort: 8889
          volumeMounts:
            - name: config-volume
              mountPath: /etc/otelcol/config.yaml
              subPath: config.yaml
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: config-volume
          configMap:
            name: otel-collector-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - protocol: TCP
      name: metrics
      port: 8888
      targetPort: 8888
    - protocol: TCP
      name: prometheus
      port: 8889
      targetPort: 8889
