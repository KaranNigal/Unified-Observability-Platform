# ============================================================================
# Unified Observability Platform — Docker Compose (Phase 2)
# ============================================================================
# Usage:
#   Full stack (~14 GB):  docker compose --profile full up --build -d
#   Lite stack (~8 GB):   docker compose up --build -d   (skips ELK)
#   Tear down:            docker compose --profile full down
#   Tear down + volumes:  docker compose --profile full down -v
# ============================================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-CeleryExecutor}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:-postgresql+psycopg2://airflow:Niraj%4031@postgres:5432/airflow}
    AIRFLOW__CELERY__BROKER_URL: ${AIRFLOW__CELERY__BROKER_URL:-redis://redis:6379/0}
    AIRFLOW__CELERY__RESULT_BACKEND: ${AIRFLOW__CELERY__RESULT_BACKEND:-db+postgresql://airflow:Niraj%4031@postgres:5432/airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES:-false}
    AIRFLOW__API__AUTH_BACKENDS: ${AIRFLOW__API__AUTH_BACKENDS:-airflow.api.auth.backend.basic_auth}
    AIRFLOW__METRICS__STATSD_ON: "True"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    AIRFLOW__WEBSERVER__X_FRAME_ENABLED: "True"
    _PIP_ADDITIONAL_REQUIREMENTS: "opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp requests"
  volumes:
    - ./services/airflow/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - observability

# ============================================================================
# Services
# ============================================================================
services:

  # --------------------------------------------------------------------------
  # PostgreSQL — Airflow metadata DB
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16.8-bookworm
    container_name: obs-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Niraj@31}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Redis — Airflow Celery broker + API cache (Phase 5)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7.4.2-alpine
    container_name: obs-redis
    command: redis-server --save 60 1 --loglevel warning --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Airflow Init — one-shot: migrate DB + create admin user
  # --------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: obs-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username $${_AIRFLOW_WWW_USER_USERNAME:-admin} \
          --password $${_AIRFLOW_WWW_USER_PASSWORD:-Niraj@31} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    environment:
      <<: *airflow-common-env
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-Niraj@31}
    mem_limit: 1g
    restart: "no"

  # --------------------------------------------------------------------------
  # Airflow Webserver
  # --------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: obs-airflow-webserver
    command: airflow webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Airflow Scheduler
  # --------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: obs-airflow-scheduler
    command: airflow scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname) || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 768m
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Airflow Celery Worker
  # --------------------------------------------------------------------------
  airflow-worker:
    <<: *airflow-common
    container_name: obs-airflow-worker
    command: airflow celery worker
    healthcheck:
      test: ["CMD-SHELL", "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d celery@$${HOSTNAME} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Apache Kafka — KRaft mode (no Zookeeper)
  # --------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.1
    container_name: obs-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    ports:
      - "9092:9092"
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Prometheus — metrics storage
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: obs-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Alertmanager — routes and deduplicates alerts
  # --------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: obs-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Elasticsearch — log storage
  # --------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.2
    container_name: obs-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms512m -Xmx512m}
      - bootstrap.memory_lock=true
      - cluster.name=obs-cluster
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    mem_limit: 1536m
    restart: unless-stopped
    profiles:
      - full
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Logstash — log ingestion pipeline
  # --------------------------------------------------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:8.17.2
    container_name: obs-logstash
    environment:
      - LS_JAVA_OPTS=${LS_JAVA_OPTS:--Xms256m -Xmx512m}
      - xpack.monitoring.enabled=false
    volumes:
      - ./logstash/pipeline/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./logstash/templates/logs_template.json:/usr/share/logstash/templates/logs_template.json:ro
    ports:
      - "5044:5044"
      - "5000:5000"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      elasticsearch:
        condition: service_healthy
    mem_limit: 768m
    restart: unless-stopped
    profiles:
      - full
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Kibana — log visualization
  # --------------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.2
    container_name: obs-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=1024
      - SERVER_PUBLICBASEURL=http://localhost:5601
      - SERVER_SECURITYRESPONSEHEADERS_XFRAMEOPTIONS=false
      - SERVER_SECURITYRESPONSEHEADERS_CROSSORIGINOPENERPOLICY=unsafe-none
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      elasticsearch:
        condition: service_healthy
    mem_limit: 1.5g
    restart: unless-stopped
    profiles:
      - full
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Grafana — metrics visualization
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.5.2
    container_name: obs-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-Niraj@31}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./dashboards/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - observability

  # --------------------------------------------------------------------------
  # StatsD Exporter — translates Airflow UDP StatsD → Prometheus metrics
  # --------------------------------------------------------------------------
  statsd-exporter:
    image: prom/statsd-exporter:v0.27.2
    container_name: obs-statsd-exporter
    command:
      - --statsd.listen-udp=:9125
      - --web.listen-address=:9102
      - --statsd.mapping-config=/etc/statsd-exporter/statsd_mapping.yml
    volumes:
      - ./prometheus/statsd_mapping.yml:/etc/statsd-exporter/statsd_mapping.yml:ro
    ports:
      - "9102:9102"
      - "9125:9125/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9102/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Pushgateway — receives metrics from short-lived PySpark batch jobs
  # --------------------------------------------------------------------------
  pushgateway:
    image: prom/pushgateway:v1.10.0
    container_name: obs-pushgateway
    ports:
      - "9091:9091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9091/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - pushgateway-data:/data
    mem_limit: 64m
    restart: unless-stopped
    networks:
      - observability


  # --------------------------------------------------------------------------
  # Spark Master — PySpark job execution
  # --------------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.4
    container_name: obs-spark-master
    command: /opt/spark/sbin/start-master.sh
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8180
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "7077:7077"
      - "8180:8180"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8180 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Spark Worker — connects to Spark Master
  # --------------------------------------------------------------------------
  spark-worker:
    image: apache/spark:3.5.4
    container_name: obs-spark-worker
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077
    environment:
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_WEBUI_PORT=8181
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "8181:8181"
    depends_on:
      spark-master:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped
    networks:
      - observability

  # ==========================================================================
  # Phase 2 — Data Source Services
  # ==========================================================================

  # --------------------------------------------------------------------------
  # Orders Service — FastAPI microservice
  # --------------------------------------------------------------------------
  orders-service:
    build:
      context: ./services/orders-service
      dockerfile: Dockerfile
    container_name: obs-orders-service
    ports:
      - "8000:8000"
    volumes:
      - shared-logs:/app/logs
    environment:
      - ENVIRONMENT=development
      - INVENTORY_SERVICE_URL=http://inventory-service:8001
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      inventory-service:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Inventory Service — FastAPI microservice
  # --------------------------------------------------------------------------
  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: obs-inventory-service
    ports:
      - "8001:8001"
    volumes:
      - shared-logs:/app/logs
    environment:
      - ENVIRONMENT=development
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Kafka Trading Producer — generates synthetic trading events
  # --------------------------------------------------------------------------
  kafka-producer:
    build:
      context: ./services/kafka-trading
      dockerfile: Dockerfile
    container_name: obs-kafka-producer
    command: ["python", "producer.py"]
    ports:
      - "8002:8002"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=trading-events
      - MESSAGES_PER_SECOND=100
      - PROMETHEUS_PORT=8002
      - ENVIRONMENT=development
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Kafka Trading Consumer — consumes events and tracks lag
  # --------------------------------------------------------------------------
  kafka-consumer:
    build:
      context: ./services/kafka-trading
      dockerfile: Dockerfile
    container_name: obs-kafka-consumer
    command: ["python", "consumer.py"]
    ports:
      - "8003:8003"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=trading-events
      - KAFKA_GROUP_ID=trading-consumer-group
      - PROMETHEUS_PORT=8003
      - ENVIRONMENT=development
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - observability

  # --------------------------------------------------------------------------
  # PySpark Batch Job — runs synthetic data processing (one-shot)
  # --------------------------------------------------------------------------
  pyspark-job:
    build:
      context: ./services/pyspark
      dockerfile: Dockerfile
    container_name: obs-pyspark-job
    environment:
      - PUSHGATEWAY_URL=http://pushgateway:9091
      - ENVIRONMENT=development
    depends_on:
      spark-master:
        condition: service_healthy
      pushgateway:
        condition: service_healthy
    mem_limit: 1g
    restart: "no"
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Jaeger — tracing backend
  # --------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: obs-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI & API
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped
    networks:
      - observability

  # --------------------------------------------------------------------------
  # OpenTelemetry Collector — central gateway for metrics and logs
  # --------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: obs-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - shared-logs:/var/log/app:ro
    ports:
      - "8888:8888" # OTel Collector internal metrics
      - "8889:8889" # Prometheus metrics exporter
    depends_on:
      statsd-exporter:
        condition: service_healthy
      pushgateway:
        condition: service_healthy
      orders-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      kafka-producer:
        condition: service_started
      kafka-consumer:
        condition: service_started
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/metrics || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Metrics API — FastAPI gateway to Prometheus metrics with Redis cache
  # --------------------------------------------------------------------------
  metrics-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: obs-metrics-api
    environment:
      - API_KEY=${API_KEY:-super-secret-key-123}
      - REDIS_URL=redis://redis:6379/0
      - PROMETHEUS_URL=http://prometheus:9090
      - DATABASE_URL=${DATABASE_URL:-postgresql://airflow:Niraj%4031@postgres:5432/airflow}
      - JWT_SECRET=${JWT_SECRET:-capsule-super-secure-jwt-secret-key-2026}
      - ENVIRONMENT=development
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - observability

  # --------------------------------------------------------------------------
  # Control Plane — Organization, Member, and API Key Management
  # --------------------------------------------------------------------------
  control-plane:
    build:
      context: ./services/control-plane
      dockerfile: Dockerfile
    container_name: obs-control-plane
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://airflow:Niraj%4031@postgres:5432/airflow}
      - JWT_SECRET=${JWT_SECRET:-capsule-control-plane-jwt-super-secret-2026}
      - ENVIRONMENT=development
    ports:
      - "8005:8005"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8005/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - observability



# ============================================================================
# Volumes — named volumes for data persistence
# ============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  kafka-data:
    driver: local
  prometheus-data:
    driver: local
  alertmanager-data:
    driver: local
  elasticsearch-data:
    driver: local
  grafana-data:
    driver: local
  airflow-logs:
    driver: local
  pushgateway-data:
    driver: local
  shared-logs:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  observability:
    driver: bridge
    name: obs-network
