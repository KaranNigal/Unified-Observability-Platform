# Logstash pipeline — Phase 1 (minimal)
# TCP JSON input on port 5000, forwarded to Elasticsearch.
# Phase 3 replaces this with OTel Collector-fed inputs.

input {
  http {
    port => 5000
    codec => json
  }
}

filter {
  if [resourceLogs] {
    split {
      field => "resourceLogs"
    }
    split {
      field => "[resourceLogs][scopeLogs]"
    }
    split {
      field => "[resourceLogs][scopeLogs][logRecords]"
    }

    # Extract message and log_level
    mutate {
      add_field => {
        "message" => "%{[resourceLogs][scopeLogs][logRecords][body][stringValue]}"
        "log_level" => "%{[resourceLogs][scopeLogs][logRecords][severityText]}"
      }
    }

    # Extract log attributes and resource attributes
    ruby {
      code => '
        attrs = event.get("[resourceLogs][scopeLogs][logRecords][attributes]")
        if attrs
          attrs.each do |attr|
            key = attr["key"]
            val_hash = attr["value"]
            if val_hash
              val = val_hash.values.first
              event.set(key, val)
            end
          end
        end

        res_attrs = event.get("[resourceLogs][resource][attributes]")
        if res_attrs
          res_attrs.each do |attr|
            key = attr["key"]
            val_hash = attr["value"]
            if val_hash
              val = val_hash.values.first
              event.set(key, val)
            end
          end
        end
      '
    }

    # Normalize log level to lowercase
    if [log_level] {
      mutate {
        lowercase => [ "log_level" ]
      }
    }

    # Convert timeUnixNano to logstash @timestamp
    ruby {
      code => '
        time_nano = event.get("[resourceLogs][scopeLogs][logRecords][timeUnixNano]")
        if time_nano
          begin
            sec = time_nano.to_i / 1000000000
            nsec = time_nano.to_i % 1000000000
            time = Time.at(sec, nsec, :nsec).utc
            event.set("@timestamp", LogStash::Timestamp.new(time))
          rescue => e
            # ignore
          end
        end
      '
    }

    # Clean up OTel internal structures
    mutate {
      remove_field => [ "resourceLogs", "headers", "host" ]
    }
  }

  if ![tenant_id] {
    mutate {
      add_field => { "tenant_id" => "demo" }
    }
  }

  mutate {
    add_field => {
      "[@metadata][target_index]" => "logs-%{+YYYY.MM.dd}"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][target_index]}"
    template => "/usr/share/logstash/templates/logs_template.json"
    template_name => "logs"
    template_overwrite => true
  }
}
