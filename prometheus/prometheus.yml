# Prometheus configuration
# Retention period is set to 15 days in docker-compose.yml (--storage.tsdb.retention.time=15d)
# to strike a balance between student resource constraints and data longevity.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
    metric_relabel_configs:
      - source_labels: [tenant_id]
        target_label: tenant_id
        regex: "(.+)"
        action: replace
      - source_labels: [tenant_id]
        target_label: tenant_id
        regex: "^$"
        replacement: "demo"
        action: replace

  - job_name: "pushgateway"
    static_configs:
      - targets: ["pushgateway:9091"]
    metric_relabel_configs:
      - source_labels: [tenant_id]
        target_label: tenant_id
        regex: "(.+)"
        action: replace
      - source_labels: [tenant_id]
        target_label: tenant_id
        regex: "^$"
        replacement: "demo"
        action: replace

  - job_name: "statsd-exporter"
    static_configs:
      - targets: ["statsd-exporter:9102"]
        labels:
          tenant_id: "demo"
    metric_relabel_configs:
      - source_labels: [tenant_id]
        target_label: tenant_id
        regex: "(.+)"
        action: replace
      - source_labels: [tenant_id]
        target_label: tenant_id
        regex: "^$"
        replacement: "demo"
        action: replace
