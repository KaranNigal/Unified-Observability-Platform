groups:
  - name: service_level_objectives
    rules:
      # SLO 1: Order Processing Latency (99% under 500ms)
      - alert: OrdersLatencySLOViolation
        expr: histogram_quantile(0.99, sum(rate(order_processing_duration_seconds_bucket[5m])) by (le, component)) > 0.5
        for: 2m
        labels:
          severity: page
          slo: "99_percentile_latency_under_500ms"
        annotations:
          summary: "SLO Violation: Orders API p99 Latency > 500ms"
          description: "The 99th percentile latency for order processing is currently {{ $value }}s, which violates our 500ms SLO guarantee. Immediate investigation required."

      # SLO 2: Order Creation Reliability (99.5% Success Rate)
      - alert: OrdersReliabilitySLOViolation
        expr: sum(rate(orders_created_total{status="failure"}[5m])) / sum(rate(orders_created_total[5m])) > 0.005
        for: 2m
        labels:
          severity: page
          slo: "99.5_percent_success_rate"
        annotations:
          summary: "SLO Violation: Order Creation Error Rate > 0.5%"
          description: "The failure rate for order creation is {{ $value | humanizePercentage }}, violating our 99.5% reliability SLO. Check inventory-service dependencies."

      # SLO 3: Trading Event Freshness (Consumer Lag < 1000)
      - alert: TradingEventFreshnessViolation
        expr: sum(kafka_consumer_lag{component="kafka-trading"}) > 1000
        for: 5m
        labels:
          severity: ticket
          slo: "consumer_lag_under_1000"
        annotations:
          summary: "SLO Warning: High Trading Event Lag"
          description: "Kafka consumer lag for trading events has been above 1000 messages (current: {{ $value }}) for 5 minutes. Trading analytics may be stale."

      # SLO 4: Batch Job Success
      - alert: PySparkBatchReliability
        expr: pyspark_job_status == 0
        for: 1m
        labels:
          severity: page
          slo: "batch_job_no_failures"
        annotations:
          summary: "SLO Violation: Synthetic Batch Job Failed"
          description: "The PySpark synthetic batch job reported a failure. Upstream analytics dashboards will be missing data until resolved."

      # SLO 5: Trading Event Tail Latency (p99.9 < 200ms)
      - alert: TradingTailLatencySLOViolation
        expr: histogram_quantile(0.999, sum(rate(kafka_producer_message_latency_seconds_bucket[5m])) by (le, component)) > 0.2
        for: 2m
        labels:
          severity: page
          slo: "99.9_percentile_trading_latency_under_200ms"
        annotations:
          summary: "SLO Violation: Trading Event p99.9 Latency > 200ms"
          description: "The 99.9th percentile (p99.9) latency for publishing trading events is currently {{ $value }}s, exceeding the strict 200ms high-frequency trading SLO guarantee. This indicates a severe tail-latency issue that averages hide."
